site_name: MindFlowIO
site_url: https://mindflowio.com
site_description: 个人知识库
site_author: wangyatai

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
  logo:
  favicon:

extra:
  generator: false
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:ytwang1295@gmail.com
    - icon: fontawesome/brands/github
      link: https://github.com/Wang-Taylor

copyright: Copyright &copy; 2026 wangyatai

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

