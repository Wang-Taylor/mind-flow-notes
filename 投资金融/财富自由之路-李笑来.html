<!DOCTYPE html><html><head><meta charset="UTF-8"><title>财富自由之路-李笑来</title></head><body><div><h1>财富自由之路-李笑来</h1></div>
<div><br></div>
<div><br></div>
<div>“三个大坑：莫名其妙地凑热闹，心急火燎地随大流，操碎了别人的心肝。”</div>
<div><br></div>
<div>注意力是每个人都拥有的、最重要的、却被人忽视了的宝贵财富。“注意力 &gt 时间 &gt 金钱”</div>
<div><br></div>
<div>“你的注意力才是你所拥有的最重要、最宝贵的资源——从这个角度望过去，人生其实是公平的，因为你的注意力确实是你自己可以做主的，除非你自己放弃”</div>
<div><br></div>
<div>“你必须把最宝贵的注意力全部放在你自己身上。关注自己的成长。</div>
<div><br></div>
<div>“不珍惜自己注意力的人，最终注定是贫穷的，因为他们终生被收割，终生不可能有真正有价值的产出，怎么可能最终变得富有？”</div>
