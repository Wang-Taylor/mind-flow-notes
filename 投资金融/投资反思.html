<!DOCTYPE html><html><head><meta charset="UTF-8"><title>投资反思</title></head><body><div><h1>投资反思</h1></div>
<div><br></div>
<div>近半年，一系列操作，买入或卖出，似乎没有坚实的理由或原因。大多数时候是凭感觉，最近再听孟岩的播客《中》，其中好几位投资大师的观点都讲到：如何在市场长期获得超额收益，除非你比大多人数掌握的信息更多，否则按照巴菲特的观点，大多数人适合买标普500基金。</div>
<div><br></div>
<div>回顾近1-2年的操作，由于没有坚实的理由，大多数买点并不好，有几次价格合适，但是不敢下重注，导致收益并不佳。</div>
<div><br></div>
<div>长期以来，要想财富稳定增长，对普通人来说，股权是最好的投资方式。同时要平衡好家庭资产中股权资产所占的比例。</div>
<div><br></div>
<div>因此，给自己制定计划，重读投资经典书籍：《彼特林奇》、《投资中最重要的事》，并研究霍华德马克思</div>
<div><br></div>
</body></html>
