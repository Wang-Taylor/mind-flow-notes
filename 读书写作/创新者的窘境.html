<!DOCTYPE html><html><head><meta charset="UTF-8"><title>创新者的窘境</title></head><body><div><h1>创新者的窘境</h1></div>
<div><br></div>
<div>“所有失败案例都具有一个共同点，那就是导致企业失败的决策，恰好是在领先企业被广泛誉为世界上最好的企业时做出的。”</div>
<div><br></div>
<div>“一种解释是，这些遭遇失败的企业的管理已经做到了极致，但它们在大获成功之后做出决策的方式，却最终埋下了它们日后失败的种子。”</div>
<div><br></div>
<div>“准确地说，因为这些企业倾听了客户的意见，积极投资了新技术的研发，以期向客户提供更多更好的产品；因为它们认真研究了市场趋势，并将投资资本系统地分配给了能够带来最佳收益率的创新领域，最终，它们都丧失了其市场领先地位。”</div>
