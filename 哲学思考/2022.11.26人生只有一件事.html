<!DOCTYPE html><html><head><meta charset="UTF-8"><title>2022.11.26人生只有一件事</title></head><body><div><h1>2022.11.26人生只有一件事</h1></div>
<div><br></div>
<div>区分我的事，别人的事，老天的事。</div>
<div><br></div>
<div>人生只有一件事，那就是修。</div>
<div><br></div>
<div>提升自我维度，才不会被非此即彼的问题困扰。两者都可要，都可不要，或要一个不要一个。</div>
<div><br></div>
<div>自己找功课，从小事上修。</div>
<div><br></div>
<div>不用区分工作与生活平衡，在哪儿都是修。</div>
<div><br></div>
<div>钱找人，资源找人，把自己变成磁铁，这些东西都会被吸引过来。</div>
<div><br></div>
<div>学会认错，真的认错不是内疚，是生惭愧心。你认错的时候你身体会发热、会兴奋。其实真正的认错是热情的、有力量的，真正认错是欢喜的，真正认错是迫不及待想要去改变，想要有所不同的，这才是真的，叫作生惭愧心。</div>
<div><br></div>
</body></html>
