<!DOCTYPE html><html><head><meta charset="UTF-8"><title>不安的哲学</title></head><body><div><h1>不安的哲学</h1></div>
<div><br></div>
<div>“不安”的对象是“无”。用我们的日常表达，就相当于“没有来由地觉得不安”。我们感到不安，通常并不是因为具体的事情，而是<u>纯粹于“无”中生不安</u><font face=".PingFangUITextSC-Regular">。”</font><br></div>
<div><br></div>
<div>“人生最大的不安不过那么几种——如何面对自身的疾病、衰老和死亡，以及如何与他人交往”</div>
<div><br></div>
<div>“每个人在意识到“没有人生来就必须满足他人期待”这件事之前，都坚信自己可以影响甚至控制某个人。”“当一个人知道自己无法满足他人的期待时，他就会意识到，自己也无法控制他人。与人交往的正确方式其实应该是“以无法完全理解对方为前提的。</div>
