<!DOCTYPE html><html><head><meta charset="UTF-8"><title>2025.5.27 臣服实验</title></head><body><div><h1>2025.5.27 臣服实验</h1></div>
<div><br></div>
<div>做成一件事，首先因为这件事是一件对的事，所以如果不是甲做,也会有乙做。不是我做•也会有别人来做。我们如果有机会做这件事，是因为我们怡巧在某个时间、某个情境碰到了这个机会，成为做成这件事的“工-具”。那我们能做的，不是觉得自己是救世主,而是把自己这个“工具”不断“变得更好”，把这件事做成。</div>
<div><br></div>
<div>灵魂是有感情、思想、希望、恐惧和梦想的人。我不应该把他关起来，不停要求他闭嘴。<br></div>
<div><br></div>
<div>有这些事情中最重要的一点就是，如果我听从了自己的想法，所有这些都不可能发生。而通过追随生命之流而非顺从自己的偏好,我现在成了木工、教师、已有发表作品的作家。</div>
<div><br></div>
</body></html>
