<!DOCTYPE html><html><head><meta charset="UTF-8"><title>逆向思维</title></head><body><div><h1>逆向思维</h1></div>
<div><br></div>
<div><b><font face=".CJKSymbolsFallbackSC-Bold">“</font></b><b><font face=".PingFangUITextSC-Bold">逆向思维”是指把一个假设或问题颠倒过来，反向思考：“</font></b><b><u>如果事实正好相反呢？</u></b><b>”</b><br></div>
<div><br></div>
<div>也就是说，预判一下若事情的发展与预期的相反，那么有什么方式可以避免此种影响，有什么应对计划。</div>
<div><br></div>
<div>当你需要提出一个观点或想法时，先用逆向思维思考一番，<u><font color="#FF2600">我的提议可能会有什么反对意见？我该如何从一开始就反击他们？</font></u><font color="#FF2600"><br></font></div>
<div><font color="#FF2600"><br></font></div>
<div><font face=".PingFangSC-Regular">例如</font>查理·芒格说那个农民说的“如果我知道我会死在哪儿，那我永远都不会去那个地方”。</div>
<div><font face=".PingFangSC-Regular"><br></font></div>
<div><font face=".PingFangSC-Regular">原来</font>逆向思维自己平时会用，但是频率很低，只是偶尔浅尝辄止使用，没有进一步往下深究。</div>
</body></html>
