<!DOCTYPE html><html><head><meta charset="UTF-8"><title>百年未有之大变局</title></head><body><div><h1>百年未有之大变局</h1></div>
<div><br></div>
<div>在工业文明时代的世界，任何一个全球帝国，它从发端到登顶，都需要翻过五座大山，按照要登攀和翻越的先后顺序，它们依次是工业大山、科技大山、金融大山、军事大山和文化大山。</div>
<div><br></div>
<div>这五座大山，对应的便是工业霸权，科技霸权，金融霸权，军事霸权和文化霸权。同样，一个全球性帝国，失去它的帝国霸权，也是他逐步丧失工业霸权、科技霸权、金融霸权、军事霸权和文化霸权，一步步走向衰落的。</div>
<div><br></div>
<div>美国之所以在经济竞争上输掉了，是因为他们在过去的几十年里，逐步丧失了自己的工业霸权。</div>
