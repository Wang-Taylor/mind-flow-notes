<!DOCTYPE html><html><head><meta charset="UTF-8"><title>开悟其实很简单</title></head><body><div><h1>开悟其实很简单</h1></div>
<div><br></div>
<div>心灵层面的人生实现需要的是：不努力、不争取，需要的是放弃、放下。 </div>
<div><br></div>
<div>心灵层面追求的是平凡，精神层面追求的是非凡，心灵层面追求的是淡定，精神层面追求的是激昂， 心灵层面越努力越挫折，精神层面奋斗就可实现。</div>
<div><br></div>
<div>心灵层面需要做减法，精神层面需要则要做加法。</div>
<div><br></div>
<div>因为所有开悟的人在交流时，他们的语言都是来自心灵，而不是大脑，一个生活在大脑世界的人怎么可能理解一个生活在心灵世界的人?</div>
<div><br></div>
<div>“没有觉知者但觉知正在进行，没有观察者但观察在发生”这就是开悟状态</div>
