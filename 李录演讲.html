<!DOCTYPE html><html><head><meta charset="UTF-8"><title>李录演讲</title></head><body><div><h1>李录演讲</h1></div>
<div><br></div>
<div>财富是经济体中的购买力</div>
<div><br></div>
<div>价值投资的理念，是拥有最具活力公司的股份，来保持财富增长。</div>
<div><br></div>
<div>个人要保持自己在经济体中的财富的比例。经济体量下行时，甚至要扩大自己的比例。个人财富才能不缩水，才拥有相当程度的购买力。</div>
<div><br></div>
<div>不要为了长期持有而长期持有。</div>
<div><br></div>
<div>如果对于一个公司懂的标准是：可以看出10年后公司最坏是什么样子。</div>
<div><br></div>
<div>当你明白一件事时，要知道自己不明白什么。</div>
<div><br></div>
<div>价值投资的6条原则</div>
<div>1、股票不是纸，是公司的一部分</div>
<div>2、市场先生是个神经病，但他是来服务你的</div>
<div>3、便宜是硬道理，安全边际是底线</div>
<div>4、只在你真正懂的圈子里下注</div>
<div>5、去有鱼的地方钓鱼</div>
<div>6、财富是购买力占比，投资就是对抗时代的稀释。</div>
<div><br></div>
