<!DOCTYPE html><html><head><meta charset="UTF-8"><title>生活太重要，不能太认真</title></head><body><div><h1>生活太重要，不能太认真</h1></div>
<div><br></div>
<div><font face=".PingFangUITextSC-Regular">听过张潇雨这一期播客，我主要有以下几点感受：</font></div>
<div>1、我们不能给别人上班，但可以给自己工作，人生在世几十年，没必要大好年华都给了工作；</div>
<div>2、没必要把某些事情看的特别重要，好像错过某些事或某些事没做好的话，自己人生就会怎么怎么样，天不会塌下来，没有什么事过不去；</div>
<div>3、在面对情绪时有体验和叙事两个层面，我们要更多的去体验，而非叙事；</div>
<div>4、人生在世，就是不断地认识自己，认识自己的方方面面，同时不断地去感受。</div>
</body></html>
